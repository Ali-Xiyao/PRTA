[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prta-cxr"
version = "0.1.0"
description = "Prior-Responsive Temporal Adaptation for longitudinal CXR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]
vision = [
  "timm>=1.0",
  "Pillow>=10",
  "torchvision>=0.16",
  "open_clip_torch>=2.24",
  "transformers>=4.40",
]
data = [
  "pandas>=2.0",
  "pyarrow>=15",
  "zstandard>=0.22",
]
figures = [
  "matplotlib>=3.8",
]
audit = [
  "captum>=0.8,<0.9",
]

[project.scripts]
prta-preflight = "prta_cxr.cli:preflight_main"
prta-train = "prta_cxr.cli:train_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
